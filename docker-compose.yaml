services:
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      # Allow loading this unsigned plugin during development.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mcpagent-app
      GF_DEFAULT_APP_MODE: development
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # AWS creds for Bedrock are read from the container environment by the
      # default AWS credential chain if not set in the plugin config UI.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      # Mount the built plugin into Grafana's plugin directory.
      - ./dist:/var/lib/grafana/plugins/mcpagent-app
