services:
  prometheus:
    image: prom/prometheus:v3.9.1
    ports:
      - "9091:9090"
    volumes:
      - ./provisioning/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3001:3000"
    environment:
      # Allow loading this unsigned plugin during development.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mcpagent-app
      # Grafana 12.4+ no longer forwards host env vars to plugin subprocesses.
      # Our backend reads AWS_* from its environment, so forward them explicitly.
      GF_PLUGINS_FORWARD_HOST_ENV_VARS: mcpagent-app
      GF_DEFAULT_APP_MODE: development
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # singleTopNav: unified top bar that hosts the nav-right-button extension
      # slot (where our "MCP Agent" button appears). Disabled by default in G13.
      # extensionSidebar: keeps the slide-out feature available.
      GF_FEATURE_TOGGLES_ENABLE: singleTopNav,extensionSidebar
      # AWS creds for Bedrock are read from the container environment by the
      # default AWS credential chain if not set in the plugin config UI.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      # Mount the built plugin into Grafana's plugin directory.
      - ./dist:/var/lib/grafana/plugins/mcpagent-app
      # Mock datasources + dashboards so page-context prefill has real content.
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./provisioning/dashboards-json:/var/lib/grafana/dashboards
